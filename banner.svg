<svg viewBox="0 0 1200 680" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background subtle dark gradient like github app showcase -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0c10"/>
      <stop offset="100%" stop-color="#11141b"/>
    </linearGradient>
    
    <!-- Smooth drop shadow for the white card -->
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <style>
      .title-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-weight: 800; }
      .body-text  { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
      .mono-text  { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
  </defs>

  <!-- Outer Canvas Background -->
  <rect width="1200" height="680" fill="url(#bgGrad)"/>

  <!-- Top Mock Window Bar -->
  <g transform="translate(60, 32)">
    <rect x="0" y="0" width="1080" height="36" rx="6" fill="#161b22" opacity="0.8"/>
    <g transform="translate(18, 14)">
      <!-- Tab indicator -->
      <rect x="0" y="-4" width="76" height="22" rx="4" fill="#21262d"/>
      <text x="38" y="11" text-anchor="middle" class="mono-text" font-size="11" font-weight="700" fill="#f0f6fc">README</text>
      
      <!-- Other tabs -->
      <text x="130" y="11" class="body-text" font-size="11" fill="#8b949e">Code of conduct</text>
      <text x="235" y="11" class="body-text" font-size="11" fill="#8b949e">Contributing</text>
      <text x="320" y="11" class="body-text" font-size="11" fill="#8b949e">MIT license</text>
    </g>
  </g>

  <!-- Main Hero Card (White Card like the reference) -->
  <rect x="60" y="76" width="1080" height="490" rx="14" fill="#ffffff" filter="url(#cardShadow)"/>

  <!-- Card Content -->
  <g transform="translate(120, 120)">
    
    <!-- Hero Row: Icon + Main Title -->
    <g transform="translate(160, 40)">
      <!-- Git Branching / Sync Icon -->
      <g transform="translate(0, 0)">
        <!-- Left node -->
        <circle cx="20" cy="20" r="14" fill="none" stroke="#0f172a" stroke-width="10"/>
        <!-- Right node top -->
        <circle cx="100" cy="20" r="14" fill="none" stroke="#0f172a" stroke-width="10"/>
        <!-- Right node bottom -->
        <circle cx="100" cy="115" r="14" fill="none" stroke="#0f172a" stroke-width="10"/>
        
        <!-- Connecting branches -->
        <path d="M 20 34 L 20 80 Q 20 115 55 115 L 86 115" fill="none" stroke="#0f172a" stroke-width="10" stroke-linecap="round"/>
        <path d="M 100 34 L 100 101" fill="none" stroke="#0f172a" stroke-width="10" stroke-linecap="round"/>
        
        <!-- Arrowhead at branch junction -->
        <polygon points="56,105 78,115 56,125" fill="#0f172a"/>
      </g>

      <!-- Main Title -->
      <text x="145" y="88" class="title-text" font-size="82" letter-spacing="-1.5" fill="#0f172a">Auto-Notes</text>
      <text x="600" y="88" class="title-text" font-size="82" letter-spacing="-1.5" fill="#2563eb">Sync</text>
    </g>

    <!-- Main Tagline -->
    <text x="420" y="240" text-anchor="middle" class="title-text" font-size="33" font-weight="700" fill="#0f172a" letter-spacing="-0.5">
      Keep your notes &amp; documents backed up with automated sync
    </text>

    <!-- Subtitle -->
    <text x="420" y="285" text-anchor="middle" class="body-text" font-size="20" font-weight="400" fill="#64748b">
      Incorporate changes the instant they are saved — Markdown, Office files, &amp; Configs.
    </text>
  </g>

  <!-- Bottom Badges / Metrics Bar (styled like probot badges in reference) -->
  <g transform="translate(60, 595)">
    <!-- Row 1 Badges -->
    <g transform="translate(320, 0)" class="mono-text" font-size="13" font-weight="600">
      <!-- Go Badge -->
      <g transform="translate(0,0)">
        <rect x="0" y="0" width="45" height="26" rx="4" fill="#334155"/>
        <text x="22" y="17" text-anchor="middle" fill="#ffffff">Go</text>
        <rect x="45" y="0" width="65" height="26" rx="4" fill="#00ADD8"/>
        <text x="77" y="17" text-anchor="middle" fill="#ffffff">1.21+</text>
      </g>

      <!-- License Badge -->
      <g transform="translate(125,0)">
        <rect x="0" y="0" width="60" height="26" rx="4" fill="#334155"/>
        <text x="30" y="17" text-anchor="middle" fill="#ffffff">license</text>
        <rect x="60" y="0" width="45" height="26" rx="4" fill="#f59e0b"/>
        <text x="82" y="17" text-anchor="middle" fill="#000000">MIT</text>
      </g>

      <!-- Push/Pull Retry -->
      <g transform="translate(245,0)">
        <rect x="0" y="0" width="55" height="26" rx="4" fill="#334155"/>
        <text x="27" y="17" text-anchor="middle" fill="#ffffff">retry</text>
        <rect x="55" y="0" width="135" height="26" rx="4" fill="#8b5cf6"/>
        <text x="122" y="17" text-anchor="middle" fill="#ffffff">exp. backoff (3x)</text>
      </g>
    </g>

    <!-- Row 2 Stat Pills -->
    <g transform="translate(160, 36)" class="mono-text" font-size="12" font-weight="600">
      <!-- Multi-folder -->
      <g transform="translate(0,0)">
        <rect x="0" y="0" width="105" height="24" rx="4" fill="#1e293b"/>
        <text x="52" y="16" text-anchor="middle" fill="#94a3b8">multi-folder</text>
        <rect x="105" y="0" width="115" height="24" rx="4" fill="#0284c7"/>
        <text x="162" y="16" text-anchor="middle" fill="#ffffff">live recursive</text>
      </g>

      <!-- Secret Shield -->
      <g transform="translate(235,0)">
        <rect x="0" y="0" width="105" height="24" rx="4" fill="#1e293b"/>
        <text x="52" y="16" text-anchor="middle" fill="#94a3b8">secret shield</text>
        <rect x="105" y="0" width="130" height="24" rx="4" fill="#10b981"/>
        <text x="170" y="16" text-anchor="middle" fill="#ffffff">pathspec + scan</text>
      </g>

      <!-- Binary & Office -->
      <g transform="translate(485,0)">
        <rect x="0" y="0" width="105" height="24" rx="4" fill="#1e293b"/>
        <text x="52" y="16" text-anchor="middle" fill="#94a3b8">office &amp; docs</text>
        <rect x="105" y="0" width="175" height="24" rx="4" fill="#6366f1"/>
        <text x="192" y="16" text-anchor="middle" fill="#ffffff">docx • xlsx • binary</text>
      </g>
    </g>
  </g>
</svg>
